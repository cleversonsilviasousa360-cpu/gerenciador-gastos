<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários – MeuBolso</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topo">
        <h1>MeuBolso</h1>
        <p>Gerenciador de gastos pessoais</p>
    </header>

    <nav class="menu">
        <a href="../index.html">Início</a>
        <a href="usuarios.html" class="ativo">Usuários</a>
        <a href="contas.html">Contas</a>
        <a href="categorias.html">Categorias</a>
        <a href="despesas.html">Despesas</a>
        <a href="metas.html">Metas</a>
    </nav>

    <main class="conteudo">
        <h2>Cadastro de Usuário</h2>

        <!-- novalidate: deixamos a validação para o PHP (lado servidor) -->
        <form class="formulario" action="../php/usuario.php" method="post" novalidate>
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome">
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="campo">
                <label for="data_nascimento">Data de nascimento</label>
                <input type="date" id="data_nascimento" name="data_nascimento">
            </div>
            <div class="campo">
                <label for="renda_mensal">Renda mensal (R$)</label>
                <input type="number" id="renda_mensal" name="renda_mensal" step="0.01" min="0">
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha">
            </div>
            <div class="campo">
                <label for="confirmar_senha">Confirmar senha</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha">
            </div>

            <div class="botoes">
                <button type="submit">Cadastrar</button>
                <button type="reset">Limpar</button>
            </div>
        </form>

        <div class="mensagem"></div>

        <a class="voltar" href="../index.html">&larr; Voltar para a página inicial</a>
    </main>

    <script src="../js/requisicao.js"></script>
</body>
</html>
